{% extends 'base.html' %}

{% block title %}Vacation Mode{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
    body {
        background: radial-gradient(ellipse 120% 80% at 50% 0%, #1d3350 0%, #0c1622 55%, #060a10 100%) fixed !important;
        color: #eef3fa;
    }
    .bm {
        --card: #18243a; --card2: #1d2b45; --line: #26354f; --fg: #eef3fa; --mut: #8fa3bd; --dim: #6f86a3;
        --acc: #5ba4e6; --acc2: #7cc4ff; --amb: #f2a65a; --amb2: #ffc489; --grn: #4cc38a; --grn2: #7be0ae;
        --ind: #8b8cf6; --ind2: #b3b4ff; --red: #e55353; --red2: #ff9a9a;
        max-width: 1240px; margin: 0 auto; padding: 22px 24px 40px; color: var(--fg);
    }
    .bm button { font-family: inherit; }
    .bm-error { background: rgba(229,83,83,.12); border: 1px solid rgba(229,83,83,.35); color: var(--red2);
                border-radius: 16px; padding: 12px 18px; margin-bottom: 16px; font-weight: 600; }

    .hero { display: flex; align-items: center; gap: 22px; padding: 26px 30px; border-radius: 26px;
            border: 1px solid var(--line); position: relative; overflow: hidden;
            background: linear-gradient(120deg, rgba(var(--h), .20), rgba(24,36,58,.9) 55%); }
    .hero .big { width: 76px; height: 76px; flex: none; border-radius: 24px; display: grid; place-items: center;
                 font-size: 32px; color: #0c1622; position: relative; z-index: 1;
                 background: linear-gradient(135deg, rgb(var(--h2)), rgb(var(--h)));
                 box-shadow: 0 12px 34px rgba(var(--h), .4); }
    .hero .txt { position: relative; z-index: 1; min-width: 0; }
    .hero h2 { margin: 0; font-size: 30px; font-weight: 600; }
    .hero p { margin: 4px 0 0; color: var(--mut); font-size: 16px; }
    .hero .chips { margin-left: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
                   position: relative; z-index: 1; }
    .chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
            background: rgba(12,22,34,.55); border: 1px solid rgba(255,255,255,.08); color: var(--mut);
            font-size: 14px; white-space: nowrap; }
    .chip i { color: var(--amb2); }
    .chip.cool i { color: var(--acc2); }
    .chip.dry i { color: var(--ind2); }
    .ridge { position: absolute; right: 0; bottom: 0; width: 520px; max-width: 70%; height: 120px; opacity: .08; }

    .grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; margin-top: 20px; align-items: start; }
    .col { display: grid; gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 24px 26px; }
    .card h3 { margin: 0; font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
    .card h3 .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 17px;
                   background: rgba(var(--c), .15); color: rgb(var(--c)); }
    .card .sub { color: var(--mut); font-size: 15px; margin: 8px 0 0; }
    .c-amb { --c: 242,166,90; } .c-grn { --c: 76,195,138; } .c-ind { --c: 139,140,246; }
    .c-mut { --c: 143,163,189; } .c-red { --c: 229,83,83; }
    .card.bad { border-color: rgba(229,83,83,.35); background: linear-gradient(120deg, rgba(229,83,83,.10), var(--card) 60%); }

    .lbl { font-size: 12px; letter-spacing: .14em; color: var(--dim); font-weight: 600; margin: 20px 0 10px; text-transform: uppercase; }
    .pick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pc { min-width: 58px; min-height: 58px; padding: 0 10px; border-radius: 16px; cursor: pointer;
          background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); color: var(--fg);
          display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; }
    .pc small { font-size: 11.5px; color: var(--dim); font-weight: 600; letter-spacing: .06em; }
    .pc.t { min-height: 48px; min-width: 74px; flex-direction: row; gap: 7px; padding: 0 16px; }
    .pc i { color: var(--mut); }
    .pc.on { background: rgba(242,166,90,.16); border-color: var(--amb); color: var(--amb2); }
    .pc.on small, .pc.on i { color: var(--amb2); }
    .pick input[type=time] { height: 48px; border-radius: 14px; padding: 0 12px; font-size: 17px; font-weight: 600;
          background: rgba(255,255,255,.06); border: 1px solid var(--amb); color: var(--fg); color-scheme: dark; }
    .hidden-date { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

    .tl { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 6px; }
    .tl.bare { border: 0; margin-top: 10px; }
    .tg { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 14px; position: relative; padding-top: 16px; }
    .tg:before { content: ""; position: absolute; left: 13px; top: 46px; bottom: -16px; width: 2px; background: var(--line); }
    .tg:last-child:before { display: none; }
    .node { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--card2);
            border: 2px solid var(--amb); color: var(--amb2); font-size: 11px; font-weight: 700; margin-top: 1px; }
    .node.done { border-color: var(--grn); background: var(--grn); color: #0c1622; }
    .node.bad { border-color: var(--red); background: var(--red); color: #0c1622; }
    .node.run { background: var(--amb); color: #0c1622; }
    .node.wait { border-color: #3a4a66; color: var(--dim); }
    .tg .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .tg .hd b { font-size: 16.5px; font-weight: 600; }
    .tg .hd span { color: var(--mut); font-size: 14px; }
    .tg .hd em { margin-left: auto; font-style: normal; color: var(--amb2); font-size: 14px; font-weight: 600; }
    .tg .hd em.ok { color: var(--grn2); } .tg .hd em.bad { color: var(--red2); } .tg .hd em.wait { color: var(--mut); }

    .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 10px; }
    .st { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; min-height: 48px;
          background: rgba(255,255,255,.035); font-size: 14.5px; cursor: pointer; border: 0; color: var(--fg); text-align: left; }
    .st i.s { width: 18px; text-align: center; color: var(--acc2); flex: none; }
    .sw { margin-left: auto; width: 38px; height: 22px; border-radius: 999px; background: var(--acc); position: relative; flex: none; }
    .sw:after { content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
    .st.off { color: var(--dim); }
    .st.off span { text-decoration: line-through; }
    .st.off i.s { color: var(--dim); }
    .st.off .sw, .sw.off { background: #33415a; }
    .st.off .sw:after, .sw.off:after { right: auto; left: 3px; background: var(--mut); }

    .ls { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 15px; min-height: 44px; flex-wrap: wrap; }
    .ls .z { width: 20px; text-align: center; flex: none; }
    .ls .n { flex: 1 1 auto; min-width: 0; }
    .ls .stx { margin-left: auto; font-size: 13px; color: var(--dim); }
    .ls.success { color: var(--mut); } .ls.success .z { color: var(--grn2); }
    .ls.running { background: rgba(242,166,90,.08); } .ls.running .z { color: var(--amb2); }
    .ls.retrying { background: rgba(229,83,83,.07); } .ls.retrying .z { color: var(--red2); }
    .ls.failed { background: rgba(229,83,83,.10); } .ls.failed .z, .ls.failed .stx { color: var(--red2); }
    .ls.pending .z { color: var(--dim); }
    .ls.skipped, .ls.cancelled { color: var(--dim); } .ls.skipped span.n { text-decoration: line-through; }

    .prog { height: 8px; border-radius: 999px; background: rgba(255,255,255,.07); overflow: hidden; margin-top: 16px; }
    .prog div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--amb), var(--amb2)); transition: width .4s; }
    .prog.grn div { background: linear-gradient(90deg, var(--grn), var(--grn2)); }
    .prog.ind div { background: linear-gradient(90deg, var(--ind), var(--ind2)); }

    .btn { min-height: 54px; padding: 0 26px; border-radius: 999px; display: inline-flex; align-items: center; gap: 10px;
           font-weight: 700; font-size: 17px; border: 0; color: #0c1622; cursor: pointer; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .b-amb { background: linear-gradient(135deg, var(--amb2), var(--amb)); box-shadow: 0 10px 26px rgba(242,166,90,.3); }
    .b-grn { background: linear-gradient(135deg, var(--grn2), var(--grn)); box-shadow: 0 10px 26px rgba(76,195,138,.28); }
    .b-ind { background: linear-gradient(135deg, var(--ind2), var(--ind)); box-shadow: 0 10px 26px rgba(139,140,246,.3); }
    .b-gh { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); color: var(--fg);
            font-size: 15px; min-height: 48px; padding: 0 18px; font-weight: 600; box-shadow: none; }
    .b-gh i { color: var(--mut); }
    .b-gh.red { color: var(--red2); border-color: rgba(229,83,83,.35); background: rgba(229,83,83,.08); }
    .b-gh.red i { color: var(--red2); }
    .btn.armed { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 10px 26px rgba(229,83,83,.35); }
    .btn.armed i { color: #fff; }
    .stack { display: grid; gap: 10px; margin-top: 18px; }
    .stack .btn { width: 100%; }
    .foot { display: flex; align-items: center; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
    .foot .note { color: var(--mut); font-size: 14px; }

    .hist { margin-top: 10px; }
    .hist .rw { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 15px; }
    .hist .rw:last-child { border: 0; }
    .hist .rw > i { width: 34px; height: 34px; flex: none; border-radius: 11px; display: grid; place-items: center;
                    background: rgba(255,255,255,.05); color: var(--acc2); font-size: 14px; }
    .hist small { display: block; color: var(--dim); font-size: 13px; }
    .tag { margin-left: auto; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .tag.ok { background: rgba(76,195,138,.14); color: var(--grn2); }
    .tag.bad { background: rgba(229,83,83,.14); color: var(--red2); }
    .tag.cx { background: rgba(255,255,255,.06); color: var(--mut); }
    .tag.go { background: rgba(242,166,90,.14); color: var(--amb2); }

    .dry { display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 14px; justify-content: center;
           background: none; border: 0; cursor: pointer; min-height: 48px; margin: 0 auto; }
    .dry.on { color: var(--ind2); }

    @keyframes bm-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    .spin { animation: bm-spin 1s linear infinite; }

    @media (max-width: 960px) {
        .grid { grid-template-columns: 1fr; }
        .hero { flex-wrap: wrap; padding: 22px; }
        .hero .chips { margin-left: 0; flex-direction: row; flex-wrap: wrap; align-items: flex-start; width: 100%; }
    }
    @media (max-width: 600px) {
        .bm { padding: 14px 12px 30px; }
        .card { padding: 20px 18px; }
        .hero h2 { font-size: 24px; }
        .hero .big { width: 60px; height: 60px; font-size: 26px; border-radius: 19px; }
        .steps { grid-template-columns: 1fr; }
    }
</style>

<div class="bm">
    <h1 class="visually-hidden">Vacation Mode</h1>
    <div id="error" class="bm-error" {% if not error %}style="display:none"{% endif %}>{{ error|default:"" }}</div>
    <div id="main"></div>
</div>

{{ status|json_script:"bm-status" }}
{{ previews|json_script:"bm-previews" }}
<script>
    const csrfToken = '{{ csrf_token }}';
    const PREHEAT = {{ preheat_enabled|yesno:"true,false" }};
    const ALLOW_DRY = {{ allow_dry_run|yesno:"true,false" }};
    let status = JSON.parse(document.getElementById('bm-status').textContent);
    const previews = JSON.parse(document.getElementById('bm-previews').textContent);
    const skipped = { vacation: new Set(), home: new Set() };
    let busy = false, pollTimer = null, editingArrival = false, dryOn = false;
    let armed = null, armTimer = null;
    let pick = null;

    const ACTIVE = ['scheduled', 'running', 'retrying'];
    const FINISHED = ['success', 'failed', 'skipped', 'cancelled'];
    const HOURS = [['12:00', '12 PM'], ['16:00', '4 PM'], ['20:00', '8 PM']];
    const KIND = {
        vacation: { label: 'Vacation mode', icon: 'fa-plane-departure' },
        home: { label: 'Opened the lodge', icon: 'fa-house' },
        preheat: { label: 'Planned arrival', icon: 'fa-temperature-arrow-up' },
    };
    const RIDGE = '<svg class="ridge" viewBox="0 0 520 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 120 L70 60 L120 85 L200 20 L260 70 L320 40 L400 90 L460 50 L520 75 L520 120Z" fill="#fff"/></svg>';

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function rid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
    function activeOp() {
        const op = status && status.active;
        return op && ACTIVE.includes(op.status) ? op : null;
    }

    // All times are shown and picked in lodge time (the controller's UTC offset),
    // so a phone in another time zone still schedules "4 PM at the lodge".
    function lodgeOffset() {
        const m = status && /([+-])(\d\d):(\d\d)$/.exec(status.server_time || '');
        if (!m) return -new Date().getTimezoneOffset();
        return (m[1] === '-' ? -1 : 1) * (parseInt(m[2], 10) * 60 + parseInt(m[3], 10));
    }
    function shifted(ms) { return new Date(ms + lodgeOffset() * 60000); }
    function fmt(ms, opts) { return shifted(ms).toLocaleString([], Object.assign({ timeZone: 'UTC' }, opts)); }
    function toMs(v) { return typeof v === 'number' ? v * 1000 : Date.parse(v); }
    const F_TIME = { hour: 'numeric', minute: '2-digit' };
    const F_DAY = { weekday: 'short', month: 'short', day: 'numeric' };
    function fmtFull(ms) { return fmt(ms, Object.assign({}, F_DAY, F_TIME)); }
    function fmtWhen(ms) {
        const days = (ymd(ms) === ymd(Date.now())) ? 0 : Math.round((dayStart(ymd(ms)) - dayStart(ymd(Date.now()))) / 86400000);
        if (days === 0) return 'Today ' + fmt(ms, F_TIME);
        if (days === 1) return 'Tomorrow ' + fmt(ms, F_TIME);
        if (days > 1 && days < 7) return fmt(ms, Object.assign({ weekday: 'short' }, F_TIME));
        return fmt(ms, Object.assign({ month: 'short', day: 'numeric' }, F_TIME));
    }
    function ymd(ms) { return shifted(ms).toISOString().slice(0, 10); }
    function dayStart(day) { return Date.parse(day + 'T00:00:00Z') - lodgeOffset() * 60000; }
    function pickMs(p) { return Date.parse(p.day + 'T' + p.time + ':00Z') - lodgeOffset() * 60000; }
    function pickValue(p) { return p.day + 'T' + p.time; }
    function dur(ms) {
        const m = Math.max(0, Math.round(ms / 60000));
        if (m >= 2880) return Math.floor(m / 1440) + ' d ' + Math.floor((m % 1440) / 60) + ' h';
        if (m >= 60) return Math.floor(m / 60) + ' h ' + (m % 60) + ' m';
        return m + ' min';
    }
    function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

    function defaultPick() {
        return { day: ymd(Date.now() + 2 * 86400000), time: '16:00', other: false };
    }
    function pickFrom(iso) {
        const ms = toMs(iso);
        const time = shifted(ms).toISOString().slice(11, 16);
        return { day: ymd(ms), time: time, other: !HOURS.some(h => h[0] === time) };
    }

    function chipsHtml(extra) {
        const op = activeOp();
        let h = '';
        if (status.dry_run || (op && op.dry_run)) h += '<span class="chip dry"><i class="fas fa-flask"></i>Dry run</span>';
        const cool = status.season === 'cooling';
        h += `<span class="chip${cool ? ' cool' : ''}"><i class="fas ${cool ? 'fa-snowflake' : 'fa-fire'}"></i>${cool ? 'Cooling' : 'Heating'} season`;
        if (status.season_avg != null) h += ` &middot; outdoor avg ${Number(status.season_avg).toFixed(1)}&deg;C`;
        h += '</span>';
        return (extra || '') + h;
    }
    function hero(h, h2, icon, title, sub, extra) {
        return `<div class="hero" style="--h:${h};--h2:${h2}"><div class="big"><i class="fas ${icon}"></i></div>
                <div class="txt"><h2>${title}</h2><p>${sub}</p></div><div class="chips">${chipsHtml(extra)}</div>${RIDGE}</div>`;
    }
    function since(kinds) {
        const hit = (status.history || []).find(x => kinds.includes(x.kind) && (x.status === 'done' || x.status === 'failed'));
        return hit ? ' &middot; since ' + esc(fmtFull(toMs(hit.created))) : '';
    }

    function toggles(groups, kind) {
        return '<div class="steps">' + groups.flatMap(g => g.steps).map(s => {
            const off = skipped[kind].has(s.id);
            return `<button type="button" class="st${off ? ' off' : ''}" role="switch" aria-checked="${!off}"
                     onclick="toggleSkip('${kind}','${esc(s.id)}')"><i class="s ${esc(s.icon)}"></i><span>${esc(s.alias)}</span><span class="sw"></span></button>`;
        }).join('') + '</div>';
    }
    function stepCount(kind) {
        const all = (previews[kind] || []).flatMap(g => g.steps);
        return { all: all.length, on: all.filter(s => !skipped[kind].has(s.id)).length };
    }

    function pickerHtml() {
        const today = ymd(Date.now());
        let h = '<div class="lbl">Day</div><div class="pick">';
        const week = [];
        for (let i = 0; i < 7; i++) {
            const ms = dayStart(today) + i * 86400000 + 12 * 3600000;
            const d = ymd(ms);
            week.push(d);
            const top = i === 0 ? 'TODAY' : fmt(ms, { weekday: 'short' }).toUpperCase();
            h += `<button type="button" class="pc${pick.day === d ? ' on' : ''}" onclick="setDay('${d}')"><small>${top}</small>${fmt(ms, { day: 'numeric' })}</button>`;
        }
        const custom = !week.includes(pick.day);
        const cms = dayStart(pick.day) + 12 * 3600000;
        h += `<button type="button" class="pc${custom ? ' on' : ''}" onclick="openDate()" aria-label="Pick another date">`
           + (custom ? `<small>${fmt(cms, { month: 'short' }).toUpperCase()}</small>${fmt(cms, { day: 'numeric' })}` : '<i class="far fa-calendar" style="font-size:18px"></i>')
           + `</button><input type="date" class="hidden-date" id="pick-date" min="${today}" value="${pick.day}" onchange="if(this.value)setDay(this.value)" tabindex="-1" aria-hidden="true"></div>`;
        h += '<div class="lbl">Arriving around</div><div class="pick">';
        HOURS.forEach(([v, l]) => {
            h += `<button type="button" class="pc t${!pick.other && pick.time === v ? ' on' : ''}" onclick="setTime('${v}')">${l}</button>`;
        });
        h += `<button type="button" class="pc t${pick.other ? ' on' : ''}" onclick="setOther()"><i class="far fa-clock"></i>Other</button>`;
        if (pick.other) h += `<input type="time" id="pick-time" step="300" value="${pick.time}" oninput="if(this.value){pick.time=this.value;refreshPlan()}" aria-label="Arrival time">`;
        return h + '</div>';
    }

    function planTimeline() {
        const arr = pickMs(pick);
        const L = status.leads_h || { house: 24, amenities: 6 };
        const leads = [L.house, L.amenities];
        const groups = previews.home || [];
        return groups.map((g, i) => {
            const last = i === groups.length - 1;
            const lead = last ? 0 : (leads[i] != null ? leads[i] : 0);
            const due = arr - lead * 3600000;
            const when = due <= Date.now() ? 'Right away' : fmtWhen(due);
            const node = last ? '<i class="fas fa-flag"></i>' : (i + 1);
            const leadTxt = lead ? `${lead} h before` : 'when you arrive';
            return `<div class="tg"><span class="node">${node}</span><div><div class="hd"><b>${esc(g.label)}</b><span>${leadTxt}</span><em>${esc(when)}</em></div>${toggles([g], 'home')}</div></div>`;
        }).join('');
    }
    function planFoot() {
        const arr = pickMs(pick);
        const n = stepCount('home');
        const past = arr <= Date.now();
        const label = editingArrival ? 'Move arrival to ' : 'Schedule for ';
        const fn = editingArrival ? 'saveArrival()' : 'schedulePreheat()';
        let note = past ? 'That time has already passed' : (n.all - n.on ? plural(n.all - n.on, 'step') + ' switched off' : '');
        if (editingArrival) note = '';
        return `<button type="button" class="btn b-amb" onclick="${fn}" ${busy || past ? 'disabled' : ''}><i class="fas fa-calendar-check"></i>${label}${esc(fmtWhen(arr))}</button>`
             + (editingArrival ? '<button type="button" class="btn b-gh" onclick="editingArrival=false;render()">Back</button>' : '')
             + `<span class="note">${note}</span>`;
    }
    function refreshPlan() {
        const tl = document.getElementById('plan-tl');
        if (tl) tl.innerHTML = planTimeline();
        const f = document.getElementById('plan-foot');
        if (f) f.innerHTML = planFoot();
    }

    function historyCard() {
        const items = (status.history || []).slice(0, 4);
        if (!items.length) return '';
        const tag = { done: ['ok', 'Done'], failed: ['bad', 'Had problems'], cancelled: ['cx', 'Cancelled'],
                      scheduled: ['go', 'Scheduled'], running: ['go', 'Running'], retrying: ['go', 'Retrying'] };
        return `<div class="card c-mut"><h3><span class="ic"><i class="fas fa-clock-rotate-left"></i></span>Recent</h3><div class="hist">`
            + items.map(x => {
                const k = KIND[x.kind] || { label: x.kind, icon: 'fa-circle' };
                const t = tag[x.status] || ['cx', x.status];
                return `<div class="rw"><i class="fas ${k.icon}"></i><span>${esc(k.label)}<small>${esc(fmtFull(toMs(x.created)))}</small></span><span class="tag ${t[0]}">${esc(t[1])}</span></div>`;
            }).join('') + '</div></div>';
    }
    function dryToggle() {
        if (!ALLOW_DRY) return '';
        return `<button type="button" class="dry${dryOn ? ' on' : ''}" role="switch" aria-checked="${dryOn}" onclick="dryOn=!dryOn;render()">
                <span class="sw${dryOn ? '' : ' off'}"></span><i class="fas fa-flask"></i>Dry run</button>`;
    }
    function armBtn(key, cls, icon, label, fn) {
        const on = armed === key;
        return `<button type="button" class="btn ${cls}${on ? ' armed' : ''}" onclick="arm('${key}',${fn})" ${busy ? 'disabled' : ''}>
                <i class="fas ${on ? 'fa-circle-exclamation' : icon}"></i>${on ? 'Tap again to confirm' : label}</button>`;
    }

    function problemsCard() {
        const last = status.active;
        if (!last || ACTIVE.includes(last.status) || last.status !== 'failed') return '';
        if (sessionStorage.getItem('bm-dismiss-' + last.id)) return '';
        const k = KIND[last.kind] || { label: last.kind };
        const fails = (last.groups || []).flatMap(g => g.steps).filter(s => s.status === 'failed');
        return `<div class="card bad c-red" style="margin-top:20px"><h3><span class="ic"><i class="fas fa-triangle-exclamation"></i></span>${esc(k.label)} finished with problems</h3>
                <div style="margin-top:10px">${fails.map(s => stepRow(s)).join('')}</div>
                <div class="foot" style="margin-top:14px"><button type="button" class="btn b-gh" onclick="sessionStorage.setItem('bm-dismiss-${esc(last.id)}','1');render()">Dismiss</button></div></div>`;
    }

    function stepRow(s) {
        const icon = {
            success: 'fas fa-check', running: 'fas fa-circle-notch spin', retrying: 'fas fa-rotate',
            failed: 'fas fa-xmark', skipped: 'fas fa-forward', cancelled: 'fas fa-ban',
        }[s.status] || 'far fa-circle';
        let d = '';
        if (s.status === 'running') d = s.progress || 'Working…';
        else if (s.status === 'retrying') d = 'Not responding' + (s.next_retry_iso ? ' · retrying ' + fmtWhen(toMs(s.next_retry_iso)) : '');
        else if (s.status === 'failed') d = s.error || 'Failed';
        else if (s.status === 'skipped') d = 'Switched off';
        const title = s.status === 'retrying' && s.error ? ` title="${esc(s.error)}"` : '';
        return `<div class="ls ${esc(s.status)}"><i class="z ${icon}"></i><span class="n">${esc(s.alias)}</span>${d ? `<span class="stx"${title}>${esc(d)}</span>` : ''}</div>`;
    }
    function groupState(g) {
        const st = g.steps.map(s => s.status);
        if (st.some(s => s === 'running' || s === 'retrying')) return st.includes('retrying') ? 'retrying' : 'running';
        if (st.length && st.every(s => FINISHED.includes(s))) return st.includes('failed') ? 'failed' : 'done';
        return 'pending';
    }
    function liveTimeline(op) {
        const groups = op.groups || [];
        return '<div class="tl bare">' + groups.map((g, i) => {
            const gs = groupState(g);
            const last = i === groups.length - 1 && op.kind === 'preheat';
            const node = { done: ['done', '<i class="fas fa-check"></i>'], failed: ['bad', '<i class="fas fa-xmark"></i>'],
                           running: ['run', '<i class="fas fa-circle-notch spin"></i>'], retrying: ['run', '<i class="fas fa-rotate"></i>'] }[gs]
                       || ['wait', last ? '<i class="fas fa-flag"></i>' : (i + 1)];
            const due = g.due_iso ? toMs(g.due_iso) : null;
            const sub = due ? (gs === 'pending' && due > Date.now() ? 'starts ' : '') + fmtWhen(due) : '';
            const em = { done: ['ok', 'Done'], failed: ['bad', 'Problems'], running: ['', 'Running'], retrying: ['bad', 'Retrying'] }[gs] || ['wait', 'Waiting'];
            return `<div class="tg"><span class="node ${node[0]}">${node[1]}</span><div><div class="hd"><b>${esc(g.label)}</b><span>${esc(sub)}</span><em class="${em[0]}">${em[1]}</em></div>
                    ${g.steps.map(stepRow).join('')}</div></div>`;
        }).join('') + '</div>';
    }

    function renderActive(op) {
        const steps = (op.groups || []).flatMap(g => g.steps);
        const done = steps.filter(s => FINISHED.includes(s.status)).length;
        const pct = steps.length ? Math.round(100 * done / steps.length) : 0;
        let h = '';
        if (op.kind === 'preheat') {
            const arr = toMs(op.arrival_iso);
            const groups = op.groups || [];
            const cur = groups.find(g => groupState(g) === 'running' || groupState(g) === 'retrying');
            const next = groups.find(g => groupState(g) === 'pending');
            let sub = '';
            if (cur) sub = esc(cur.label) + ' in progress';
            else if (next && next.due_iso && toMs(next.due_iso) > Date.now()) sub = esc(next.label) + ' starts in ' + dur(toMs(next.due_iso) - Date.now());
            else sub = 'Getting the lodge ready';
            const left = arr - Date.now();
            const extra = left > 0 ? `<span class="chip"><i class="fas fa-hourglass-half"></i>${dur(left)} to go</span>` : '';
            h += hero('242,166,90', '255,196,137', 'fa-temperature-arrow-up', 'Arriving ' + esc(fmtFull(arr)), sub, extra);
        } else if (op.kind === 'home') {
            h += hero('76,195,138', '123,224,174', 'fa-house', 'Opening the lodge', `${done} of ${steps.length} steps done`);
        } else {
            h += hero('139,140,246', '179,180,255', 'fa-plane-departure', 'Switching to vacation mode', `${done} of ${steps.length} steps done`);
        }
        const bar = op.kind === 'home' ? ' grn' : op.kind === 'vacation' ? ' ind' : '';
        h += `<div class="grid"><div class="card c-amb"><h3><span class="ic"><i class="fas fa-list-check"></i></span>Progress</h3>
              <div class="prog${bar}"><div style="width:${pct}%"></div></div>${liveTimeline(op)}</div><div class="col">`;
        if (op.kind === 'preheat') {
            h += '<div class="card c-amb"><h3><span class="ic"><i class="fas fa-sliders"></i></span>Change plans</h3>';
            if (editingArrival) {
                h += `<p class="sub">Pick the new arrival time.</p>${pickerHtml()}<div class="foot" id="plan-foot">${planFoot()}</div>`;
            } else {
                h += `<div class="stack">
                      <button type="button" class="btn b-gh" onclick="startEdit()" ${busy ? 'disabled' : ''}><i class="fas fa-clock"></i>Change arrival time</button>
                      <button type="button" class="btn b-gh" onclick="send('arrive_now')" ${busy ? 'disabled' : ''}><i class="fas fa-house" style="color:var(--grn2)"></i>We're here — finish now</button>
                      ${armBtn('cancel', 'b-gh', 'fa-ban', 'Cancel the rest', "()=>send('cancel')")}
                      ${armBtn('vacation', 'b-gh red', 'fa-plane-departure', 'Back to vacation mode', "()=>send('vacation')")}
                      </div><p class="sub" style="margin-top:14px">Cancelling leaves anything that already ran as it is.</p>`;
            }
            h += '</div>';
        } else {
            h += `<div class="card c-mut"><h3><span class="ic"><i class="fas fa-sliders"></i></span>Change plans</h3>
                  <div class="stack">${armBtn('cancel', 'b-gh', 'fa-ban', 'Stop', "()=>send('cancel')")}</div>
                  <p class="sub" style="margin-top:14px">Stopping leaves everything as it is now.</p></div>`;
        }
        return h + historyCard() + '</div></div>';
    }

    function renderHome() {
        const n = stepCount('vacation');
        let h = hero('76,195,138', '123,224,174', 'fa-house', 'Lodge is open', 'Set for people' + since(['home', 'preheat']));
        h += problemsCard();
        h += `<div class="grid"><div class="card c-ind"><h3><span class="ic"><i class="fas fa-plane-departure"></i></span>Leaving?</h3>
              <p class="sub">Sets the lodge back for an empty house. Switch off anything you want left as it is.</p>
              <div class="lbl">${plural(n.all, 'step')}</div>${toggles(previews.vacation || [], 'vacation')}
              <div class="foot">${armBtn('vacation', 'b-ind', 'fa-plane-departure', 'Start vacation mode', "()=>startNow('vacation')")}
              <span class="note">${n.all - n.on ? plural(n.all - n.on, 'step') + ' switched off · ' : ''}Tap twice to confirm</span></div></div>
              <div class="col">${historyCard()}${dryToggle()}</div></div>`;
        return h;
    }

    function renderAway() {
        const n = stepCount('home');
        let h = hero('139,140,246', '179,180,255', 'fa-plane-departure', 'Vacation mode', 'The lodge is set back and waiting' + since(['vacation']));
        h += problemsCard();
        h += '<div class="grid">';
        const here = `<div class="card c-grn"><h3><span class="ic"><i class="fas fa-house"></i></span>Here now?</h3>
              <p class="sub">Run ${n.on === n.all ? 'all ' : ''}${plural(n.on, 'arrival step')} right away.</p>
              ${PREHEAT ? '' : `<div class="lbl">${plural(n.all, 'step')}</div>${toggles(previews.home || [], 'home')}`}
              <div class="foot" style="margin-top:18px"><button type="button" class="btn b-grn" onclick="startNow('home')" ${busy || !n.on ? 'disabled' : ''}><i class="fas fa-house"></i>Open the lodge now</button></div></div>`;
        if (PREHEAT) {
            h += `<div class="card c-amb"><h3><span class="ic"><i class="fas fa-calendar-check"></i></span>Plan an arrival</h3>
                  <p class="sub">Pick when you'll get here. The lodge warms up in stages so it's ready when you walk in.</p>
                  ${pickerHtml()}<div class="tl" id="plan-tl">${planTimeline()}</div><div class="foot" id="plan-foot">${planFoot()}</div></div>
                  <div class="col">${here}${historyCard()}${dryToggle()}</div>`;
        } else {
            h += `${here}<div class="col">${historyCard()}${dryToggle()}</div>`;
        }
        return h + '</div>';
    }

    function render() {
        const m = document.getElementById('main');
        if (!status) { m.innerHTML = ''; return; }
        if (!pick) pick = defaultPick();
        const op = activeOp();
        if (!op) editingArrival = false;
        if (op) m.innerHTML = renderActive(op);
        else if (status.occupancy === 'home') m.innerHTML = renderHome();
        else m.innerHTML = renderAway();
        schedulePoll();
    }

    function setDay(d) { pick.day = d; render(); }
    function setTime(t) { pick.time = t; pick.other = false; render(); }
    function setOther() {
        pick.other = true;
        render();
        const t = document.getElementById('pick-time');
        if (t) t.focus();
    }
    function openDate() {
        const d = document.getElementById('pick-date');
        if (!d) return;
        try { d.showPicker(); } catch (e) { d.focus(); d.click(); }
    }
    function startEdit() {
        const op = activeOp();
        pick = op && op.arrival_iso ? pickFrom(op.arrival_iso) : defaultPick();
        editingArrival = true;
        render();
    }
    function toggleSkip(kind, id) {
        if (skipped[kind].has(id)) skipped[kind].delete(id); else skipped[kind].add(id);
        render();
    }
    function arm(key, fn) {
        if (armTimer) clearTimeout(armTimer);
        if (armed === key) { armed = null; fn(); return; }
        armed = key;
        armTimer = setTimeout(() => { armed = null; render(); }, 4000);
        render();
    }
    function showError(msg) {
        const e = document.getElementById('error');
        e.textContent = msg || '';
        e.style.display = msg ? 'block' : 'none';
    }

    async function send(cmd, extra) {
        busy = true;
        armed = null;
        showError('');
        render();
        try {
            const body = Object.assign({ cmd: cmd, request_id: rid() }, extra || {});
            if (ALLOW_DRY && dryOn) body.dry_run = true;
            const res = await fetch('{% url "bdl_modes_command" %}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify(body),
            });
            const data = await res.json();
            if (data.error) { showError(data.error); return false; }
            status = data;
            editingArrival = false;
            return true;
        } catch (err) {
            showError('Could not reach the hub: ' + err);
            return false;
        } finally {
            busy = false;
            render();
        }
    }
    function startNow(kind) { send(kind, { skip_steps: Array.from(skipped[kind]) }); }
    function schedulePreheat() {
        if (pickMs(pick) <= Date.now()) { showError('Pick an arrival time in the future'); return; }
        send('preheat', { arrival: pickValue(pick), skip_steps: Array.from(skipped.home) });
    }
    function saveArrival() {
        if (pickMs(pick) <= Date.now()) { showError('Pick an arrival time in the future'); return; }
        send('update_arrival', { arrival: pickValue(pick) });
    }

    function schedulePoll() {
        if (pollTimer) clearTimeout(pollTimer);
        const op = activeOp();
        const fast = op && op.status !== 'scheduled';
        pollTimer = setTimeout(poll, fast ? 2000 : 30000);
    }
    async function poll() {
        try {
            const res = await fetch('{% url "bdl_modes_status" %}');
            const data = await res.json();
            if (data.error) { showError(data.error); }
            else {
                if (document.getElementById('error').textContent.startsWith('Lodge controller')) showError('');
                status = data;
            }
        } catch (err) { /* keep last state */ }
        const a = document.activeElement;
        if (busy || armed || (a && a.tagName === 'INPUT')) schedulePoll();
        else render();
    }

    render();
</script>

{% endblock %}
